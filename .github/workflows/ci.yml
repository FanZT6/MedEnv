name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -r data_process/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: MEDENV_TEST_REPO_ROOT="$PWD" python -m unittest discover -s data_process/tests -v
      - run: python data_process/check_release.py
      - run: python scripts/validate_data.py --bench-root data/synthetic
